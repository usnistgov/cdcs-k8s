postgresql:
  enabled: true
  architecture: standalone # replication
  service:
    name: "postgres-cluster-ip-service"
    port: "5432"
  auth:
      database: ""
      existingSecret: "postgres"
      secretKeys:
        usernameKey: "POSTGRES_USER"
        passwordKey: "POSTGRES_PASSWORD"
        databaseKey: "POSTGRES_DB"
  readReplicas:
    service:
      name: ""
      port: "5432"

redis:
  enabled: true
  service:
    name: "redis-cluster-ip-service"
    port: "6379"
  auth:
      existingSecret: "redis"
      secretKeys:
        passwordKey: "REDIS_PASS"

mongodb:
  enabled: false
  service:
    name: "mongo-cluster-ip-service"
    port: "27017"
  auth:
      existingSecret: "mongodb"
      secretKeys:
        usernameKey: "MONGO_USER"
        passwordKey: "MONGO_PASS"
        databaseKey: "MONGO_INITDB_DATABASE"
