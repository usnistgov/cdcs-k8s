  # allowPrivilegeEscalation: false
  # runAsNonRoot: true
  # runAsUser: 1000

cdcs:
  image: mdcs
  tag: latest
  nodeSelector: {}
  tolerations: []
  affinity: {}
  imagePullPolicy: Always
  securityContext: {}
  resources: {}
  replicas: 1
  sidecar:
    image: nginx
    tag: 1.25
    imagePullPolicy: Always
    securityContext: {}
    resources: {}
  secret:
    create: true
    name: "{{ .Release.Name }}-cdcs-secret"
    django_secret_key: ""
  persistence:
    media:
      # Uncomment to use an existing claims for the media folder
#      existingClaim: "cdcs-pvc-media"
      # Set to false for an existing claim
      create: true
      size: 10Gi
      storageClassName: ""
  ingress:
    enabled: true
    className: ""
    annotations:
      kubernetes.io/ingress.class: "nginx"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    hostname: localhost
    tls: [ ]
    # Uncomment to set a TLS secret
    #  - secretName: cdcs-tls
  celery:
    # Set true to start celery beat and workers independently from django server
    startService: false
    nodeSelector: {}
    tolerations: []
    affinity: {}
    replicas: 1
  envs:
    - name: PROJECT_NAME
      value: "mdcs"
    - name: SERVER_URI
      value: "https://localhost"
    - name: SERVER_NAME
      value: "mdcs"
    - name: ALLOWED_HOSTS
      value: "localhost"
    - name: SETTINGS
      value: "settings"
    - name: MONGODB_INDEXING
      value: "False"
    - name: GRIDFS_STORAGE
      value: "False"
