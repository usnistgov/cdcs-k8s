{{- if .Values.cdcs.celery.startService }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cdcs-celery-beat
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      component: cdcs-celery-beat
  template:
    metadata:
      labels:
        component: cdcs-celery-beat
    spec:
      containers:
      - image: {{ .Values.cdcs.image }}:{{ .Values.cdcs.tag }}
        imagePullPolicy: {{ .Values.cdcs.imagePullPolicy }}
        name: cdcs
        command:
        - "/docker-entrypoint-celery-beat.sh"
        args: ["$(PROJECT_NAME)"]
        env:
        {{- range .Values.cdcs.envs }}
        - name: {{ .name }}
          value: "{{ .value }}"
        {{- end }}
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ tpl (.Values.cdcs.secret.name) . }}"
              key: django_secret_key
        {{- if .Values.postgresql.enabled }}
        {{- with .Values.postgresql }}
        - name: POSTGRES_HOST
          value: "{{ .service.name }}"
        - name: POSTGRES_PORT
          value: "{{ .service.port }}"
        - name: POSTGRES_DB
        {{- if and .auth.existingSecret .auth.secretKeys.databaseKey }}
          valueFrom:
            secretKeyRef:
              name: "{{.auth.existingSecret}}"
              key: "{{.auth.secretKeys.databaseKey}}"
        {{- else }}
          value: "{{.auth.database}}"
        {{- end }}
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: "{{.auth.existingSecret}}"
              key: "{{.auth.secretKeys.usernameKey}}"
        - name: POSTGRES_PASS
          valueFrom:
            secretKeyRef:
              name: "{{.auth.existingSecret}}"
              key: "{{.auth.secretKeys.passwordKey}}"
        {{- if eq .architecture "replication" }}
        - name: POSTGRES_REPLICA_HOST
          value: "{{ .readReplicas.service.name }}"
        - name: POSTGRES_REPLICA_PORT
          value: "{{ .readReplicas.service.port }}"
        - name: POSTGRES_REPLICA_DB
        {{- if and .auth.existingSecret .auth.secretKeys.databaseKey }}
        valueFrom:
          secretKeyRef:
            name: "{{.auth.existingSecret}}"
            key: "{{.auth.secretKeys.databaseKey}}"
        {{- else }}
        value: "{{.auth.database}}"
        {{- end }}
        - name: POSTGRES_REPLICA_USER
          valueFrom:
            secretKeyRef:
              name: "{{.auth.existingSecret}}"
              key: "{{.auth.secretKeys.usernameKey}}"
        - name: POSTGRES_REPLICA_PASS
          valueFrom:
            secretKeyRef:
              name: "{{.auth.existingSecret}}"
              key: "{{.auth.secretKeys.passwordKey}}"
        {{- end }} # end if replication
        {{- end }} # end with postgresql
        {{- end }} # end if postgresql
        {{- if .Values.mongodb.enabled }}
        {{- with .Values.mongodb }}
        - name: MONGO_HOST
          value: "{{ .service.name }}"
        - name: MONGO_PORT
          value: "{{ .service.port }}"
        - name: MONGO_DB
          valueFrom:
            secretKeyRef:
              name: "{{.auth.existingSecret}}"
              key: "{{ .auth.secretKeys.databaseKey }}"
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: "{{.auth.existingSecret}}"
              key: "{{ .auth.secretKeys.usernameKey }}"
        - name: MONGO_PASS
          valueFrom:
            secretKeyRef:
              name: "{{.auth.existingSecret}}"
              key: "{{ .auth.secretKeys.passwordKey }}"
        {{- end }} # end with mongodb
        {{- end }} # end if mongodb
        {{- if .Values.redis.enabled }}
        {{- with .Values.redis }}
        - name: REDIS_HOST
          value: "{{ .service.name }}"
        - name: REDIS_PORT
          value: "{{ .service.port }}"
        - name: REDIS_PASS
          valueFrom:
            secretKeyRef:
              name: "{{.auth.existingSecret}}"
              key: "{{ .auth.secretKeys.passwordKey }}"
        {{- end }} # end with redis
        {{- end }} # end if redis
        - name: DJANGO_SETTINGS_MODULE
          value: "$(PROJECT_NAME).$(SETTINGS)"
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: Always
      {{- with .Values.cdcs.celery.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cdcs.celery.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cdcs.celery.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}